
apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi-deployment
  labels:
    app: fastapi

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fastapi

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: fastapi

    spec:
      containers:
        - name: fastapi-container
          image: docker777john/my-fastapi-app:latest

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
